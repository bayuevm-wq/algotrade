[project]
name = "algotrade"
version = "0.1.0"
description = "Sistem riset trading multi-pasar (crypto CEX, saham US, DEX): data, backtest, validasi"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<4",
    "numpy>=1.24",
    "yfinance>=0.2.40",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "ccxt>=4.4",
    "duckdb>=1.1",
    "pyarrow>=16",
    "exchange-calendars>=4.5",
]

[project.optional-dependencies]
dev = [
    "detect-secrets>=1.5",
    "mnemonic>=0.21",
    "pre-commit>=3.7",
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
algotrade = "algotrade.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
