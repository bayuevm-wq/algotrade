# ===== Konfigurasi `backtest`, `walkforward`, dan `compare` =====
# Data diambil dari store (jalankan `algotrade data update` dulu). Daftar simbol dan SEMUA
# biaya ada di config/instruments.yaml.
instrument:
  market: cex                # cex / us_equity / dex / idx
  symbol: BTC/USDT
  timeframe: 1d

# Dipakai `compare` bila --symbols / --market tidak diisi
compare:
  market: cex
  symbols: [BTC/USDT, ETH/USDT]

strategy:
  name: sma_cross            # pilihan: sma_cross, rsi_meanrev
  params:
    fast: 20
    slow: 100

# Grid parameter untuk walk-forward (hanya dipakai perintah `walkforward`)
param_grid:
  fast: [10, 20, 50]
  slow: [100, 150, 200]

backtest:
  initial_capital: 10000     # dalam mata uang quote (USD/USDT/IDR); memengaruhi biaya gas DEX
  allow_short: false

walkforward:
  train_years: 3
  test_years: 1
  optimize_metric: sharpe
